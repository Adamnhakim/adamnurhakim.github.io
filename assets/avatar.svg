<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#4facfe" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="160" cy="160" r="150" fill="url(#bgGlow)" />

  <!-- Outer Orbit Rings (Distributed Nodes) -->
  <circle cx="160" cy="160" r="130" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.35" />
  <circle cx="160" cy="160" r="95" stroke="#6366f1" stroke-width="1" stroke-dasharray="6 6" opacity="0.4" />

  <!-- Orbiting Microservice Nodes -->
  <g filter="url(#shadowGlow)">
    <circle cx="50" cy="120" r="16" fill="#0f172a" stroke="#00f2fe" stroke-width="2" />
    <text x="50" y="124" text-anchor="middle" fill="#00f2fe" font-family="monospace" font-size="9" font-weight="bold">K8s</text>

    <circle cx="270" cy="120" r="16" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <text x="270" y="124" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="9" font-weight="bold">Go</text>

    <circle cx="230" cy="250" r="16" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
    <text x="230" y="254" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="9" font-weight="bold">RCA</text>

    <circle cx="90" cy="250" r="16" fill="#0f172a" stroke="#a855f7" stroke-width="2" />
    <text x="90" y="254" text-anchor="middle" fill="#a855f7" font-family="monospace" font-size="9" font-weight="bold">Arch</text>
  </g>

  <!-- Connecting Lines -->
  <path d="M50 120 L160 160 L270 120 M160 160 L230 250 M160 160 L90 250" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="3 3"/>

  <!-- Center Architect Core Badge -->
  <rect x="95" y="95" width="130" height="130" rx="26" fill="url(#cardGrad)" stroke="url(#primaryGrad)" stroke-width="2.5" filter="url(#shadowGlow)" />
  
  <!-- Subtle Internal Grid -->
  <path d="M125 95 V225 M160 95 V225 M195 95 V225 M95 125 H225 M95 160 H225 M95 195 H225" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.08" />

  <!-- Shield / Architecture Emblem -->
  <path d="M160 115 L195 130 V165 C195 188 160 205 160 205 C160 205 125 188 125 165 V130 Z" fill="url(#primaryGrad)" opacity="0.15" />
  <path d="M160 118 L190 132 V162 C190 182 160 197 160 197 C160 197 130 182 130 162 V132 Z" stroke="url(#primaryGrad)" stroke-width="2" fill="none" />

  <!-- Code / Node / Architecture Symbol inside Shield -->
  <path d="M148 150 L140 158 L148 166" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M172 150 L180 158 L172 166" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M163 147 L157 169" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

  <!-- Status Indicator Ping -->
  <circle cx="215" cy="105" r="5" fill="#10b981" />
  <circle cx="215" cy="105" r="9" stroke="#10b981" stroke-width="1.5" opacity="0.6">
    <animate attributeName="r" values="6;12;6" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite" />
  </circle>

  <!-- Title Pill at Bottom -->
  <rect x="100" y="210" width="120" height="24" rx="12" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1" />
  <text x="160" y="226" text-anchor="middle" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="10.5" letter-spacing="0.5">TECHNICAL LEAD</text>
</svg>
